# porelo-mcp, which every account of an acceptance run gets before its first scenario: the newest snapshot of the
# package porelo-mcp publishes, as a .deb for a machine with dpkg-deb and as an .rpm for one with rpm2cpio and cpio.
# The run lists each folder through Artifactory's storage API, takes the newest name that matches, and checks the
# download against the sha256 Artifactory names for that file before anything else.
artifactory=https://fuinorg.jfrog.io/artifactory
deb.folder=porelo-dist-deb/pool/main/p/porelo-mcp
deb.name=porelo-mcp_{version}_amd64.deb
rpm.folder=porelo-dist-rpm/snapshots
rpm.name=porelo-mcp-{version}-1.x86_64.rpm
