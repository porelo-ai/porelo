# Deletes test servers that a run could not clean up after itself.
name: Sweep abandoned test servers

on:
    schedule:
        - cron: '17 * * * *'
    workflow_dispatch:

# Read for the workflow as a whole; a job that needs to write says so in its own block.
permissions:
    contents: read

jobs:
    sweep:
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: The pinned GraalVM
              uses: ./.github/actions/pinned-jdk

            # A server past the end its lease wrote into porelo-expires, or one that says nothing of its time: never one still
            # within it, however old.
            - name: Delete what is past its time
              env:
                  HETZNER_API: ${{ secrets.HETZNER_API }}
              # porelo-machines from Central, at the root pom's porelo.buildtools.version.
              run: ./mvnw -B -q -U -s settings.xml -N exec:exec@machines -Dmachines.args="sweep --now"
