title: "A backup key replaces only the key it backs: a follow with `--accept-rewrite` takes no backup key, the key a backup key puts in place and every signer are checked against the registries read here and the revocation list, a backup key a person names with `--signed-by` is judged as one and never pinned, `project access` signs with no key a registry read here revokes, `identity backup-key` refuses a checkout whose origin moved and a person whose own key is revoked, a repeated `--id` answers only the change it made on the base given, and no file the command did not write, nor a key already filed, is removed; a backup key is never pinned, active or retired, on an unchanged tip or across a signer change, nor signs a commit that names it a backup key, a trust record holding a host file a backup key placed is discarded, no key a registry or this machine's revocation list revokes is pinned or signs `owners.yml`, an `--id` answers only a commit its own key signed and never after that key was revoked, and no refusal names an address with its userinfo"
type: security
