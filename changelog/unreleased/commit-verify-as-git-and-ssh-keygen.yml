title: "`porelo commit verify` reads a commit and an allowed-signers line as git and ssh-keygen read them: a commit signed over a second signature header is refused and one signed for both object formats accepted, a `\\\"` in a quoted option and a `valid-after` time ending in `z` or `UTC` are understood, a cut-short reason never ends in half a character, every header starting with `gpgsig` is left out of what a signature covers, a quoted principal list with spaces is read, and a `valid-after` day or second past its range rolls over as ssh-keygen rolls it, a person's signature is verified by the principals ssh-keygen finds for the key as git verifies it and answered with the principal that verified, only a space or a tab parts an allowed-signers line, and a configuration key pinned under a quoted principal is unpinned when it is retired or its project unfollowed"
type: fixed
