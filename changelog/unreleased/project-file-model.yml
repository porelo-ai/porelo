title: "`project.yml` and a repository's `porelo.yml` are read in one format only: the image keys are renamed (`base_image` is `from`, `snippet` is `run`, `snippet_file` is `run_file`, and `image.env` is read from the project file too), `image.package_sources` moved to `build.package_sources`, and an entry under `repositories` holds no `image`, `egress` or `limits` any more, its image being in its own `porelo.yml` and what a task reaches or consumes the project's alone; every key Porelo does not know is refused rather than warned of, and a file in the earlier format is refused whole, each old key named with its line and what to write instead"
type: changed
