title: "The daemon's `Reach` answers what a task on this machine can reach, hold, spend and produce, each row in the words of the page \"How far a task can get\" with the numbers the code enforces and whether it is a control, an accident-catcher or not bounded, and for one task also the names its run was granted, what its clearance mode does with an undeclared reach and an authority it was handed"
type: added
