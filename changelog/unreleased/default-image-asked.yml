title: "In `default`, the image a checkout's `porelo.yml` and `.porelo.yml` give is asked for and allowed like their other settings: its base image, each line it adds and each variable are shown, a No or a start with `--no-input` or nobody at a terminal builds none of it and refuses the start, and a changed line asks again; `porelo task prepare` builds only what was allowed, and a line written after the question is refused, not built; a first start shows a `.porelo.yml` already in the checkout and names it in the hash its yes takes, and a file that is a link gives no line of an image. In a project written on this machine, the image a repository's unsigned `porelo.yml` gives from its mirror is asked for the same way, and a change upstream asks again; the first start of such a project after the upgrade asks once, so an unattended start is refused until a person says yes"
type: security
