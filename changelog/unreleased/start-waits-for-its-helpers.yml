title: "`porelo task start` waits until the task's gate and relay, and a resume until each of its helpers, has recorded its pid, and both fail with exit 70 when one does not come up, stopping it rather than answering 0 for a task without it; `vault serve` records its pid before it writes its token, a host refuses a task whose key or forge token it cannot keep before the task is recorded to come back, so the next start refuses it again rather than resuming it, and a start that fails cleans up only the container its own create made, never another start's of the same name"
type: fixed
