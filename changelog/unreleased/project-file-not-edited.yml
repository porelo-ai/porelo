title: "Porelo no longer changes an existing `project.yml`: `porelo shield egress`, `--also-project`, the daemon's `SetEgress`, `porelo project repository add`, `change` and `remove`, `porelo project review` and `porelo project init --yes` show the entry to add instead; what a task may reach and consume is the project's alone, and a repository's `porelo.yml` names its own `from` and is taken whole"
type: changed
