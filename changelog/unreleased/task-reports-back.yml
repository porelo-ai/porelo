title: "A task reports back to whoever started it with `Report(task, kind, text)` over its own MCP endpoint, where the project file's `limits.reports` allows it, none by default and at most 100 per task; the daemon numbers each report in the sequence of the task's name and keeps it with the task's work records, also after the task is removed, the row in List and Watch carries the last number as `reports`, and `Reports(task, after)`, `porelo task reports TASK --after N --json` and each record of `porelo task records --json` answer them, that record also carrying the `callerKey` its start was given"
type: added
