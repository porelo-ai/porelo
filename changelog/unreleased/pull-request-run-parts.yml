title: "A task can start at a pull request: Start asks the forge before anything is made and answers NoSuchPullRequest, UnknownForge or PlaceUnreadable (an unreadable forge file among its reasons); once the task's gate and mailbox exist and before its agent runs, the daemon pins the pull request's head, reads its whole conversation through the installed forge adapter with the forge token lent for each call, checks each comment with the message filter as the forge's setting says and hands the task what passed; the message pass takes a run's submission into the task's current run, a released item is sent at once, a reply is written where its thread stands on the forge, and Stop and Remove end the task's run"
type: added
