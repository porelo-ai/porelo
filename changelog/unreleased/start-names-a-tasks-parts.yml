title: "A task start names its parts in place of a role: Tasks1 `Start` and `CanStart` take `rights`, `readLanded`, `writeAs` and `projectServices`, `porelo task start` takes `--right`, `--read-landed` and `--write-as`, a broken start rule is refused as `StartRuleBroken` (exit code 64), and an act a task's rights lack is refused with the rule `RightMissing: <right> (<act>)` in its mailbox's refusal and its gate's log; `role`, `reads`, `--role`, `--reads`, `RoleNotAllowed` and `review open --role` are gone, and a task's row carries its `workspace` and four parts"
type: changed
