title: "No address Porelo accepts, keeps or prints holds a credential in any spelling git or ssh reads: a registry's access repository and an access file's `source` take no https user part, ssh password or `%`-spelled user, a checkout's origin is cut at the last `@` before its first `/` and otherwise kept as given, and `registry joinable` lends git no `.netrc` and no variable a program acts on; a bracketed host is an IPv6 address whose zone git does not decode into an `@`, a `%40` after a plain ssh user leaves the authority out whole, the `user@host:path` form is cut where git splits it, an IPv6 host is matched to its credential and repository whole, and `registry joinable` lends a token to an account whose paths hold a letter outside ASCII"
type: fixed
