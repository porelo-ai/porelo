title: "No address Porelo accepts, keeps or prints holds a credential in any spelling git or ssh reads: a checkout's origin is cut at the last `@` before its first `/` and otherwise kept as given; a bracketed host is an IPv6 address whose zone git does not decode into an `@`, a `%40` after a plain ssh user leaves the authority out whole, the `user@host:path` form is cut where git splits it, and an IPv6 host is matched to its credential and repository whole"
type: fixed
