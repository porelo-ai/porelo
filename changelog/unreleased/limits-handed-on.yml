title: Porelo hands the account's time factors on as the limits line to every agent, build reader and ecosystem adapter it starts, to a task as PORELO_LIMITS and in its sidecar's limits field, which the reader hook hands to the porelo it starts, and porelo-host hands its own to the porelo it runs under a dynamic user, which takes a leading --limits, while one it runs as a person follows that person's own settings; an empty limits line is refused like any malformed one; for agents the protocol is 6 and the lowest Porelo accepts, so a package manager refuses an agent built before the start took the limits line, while a build reader or ecosystem adapter built before it fails at its start, and a task started by an older Porelo is refused by its hooks, which write why to its hooks.log, and is recreated.
type: changed
