title: "A task's start takes its run's role and place: `porelo task start --role author|reviewer --place URL|own|push:NAME`, as the daemon's Start and CanStart take them, which now take a pull request's address too; each refuses by the same name before anything is made: a forge this machine does not know as UnknownForge, and a forge file that cannot be read (the new reason ForgeFileUnreadable), a forge adapter that is not installed or a forge token the vault lacks as PlaceUnreadable; the vault is asked only whether it holds the forge's token, never for its value"
type: added
