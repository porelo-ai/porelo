title: "A git address's credential is chosen by the host git connects to, where 'https://evil.example#@github.com/x' was offered github.com's token: an https address with a user part or any '@' takes neither git.token.<host> nor git.token, while a declared credential still applies by its normalized address, and an address that names no host or that git reads as another host takes no entry at all"
type: security
