title: "porelo vault credential --for <url> answers git's request for an https address with the token Porelo would lend for it, declared for the address or held under the name its host implies, so a program reading a private repository passes only the address; another host, port or scheme, a path beside the address's, an ssh address or a key gets nothing, and a shut vault fails with one line on standard error, never a prompt"
type: added
