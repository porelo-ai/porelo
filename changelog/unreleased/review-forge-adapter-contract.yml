title: "`porelo-build-api` describes the review contract a forge adapter serves beside `Build2` on the same socket, `org.fuin.porelo.Review1`: a pull request's facts, the open pull request from a branch, a page of its conversation and one post, each as review profile 2, with Porelo's client that refuses another version, holds every answer to profile 2's shapes and bounds, keeps the lent token out of its messages and hands every document on as bytes; the build stub answers it from its answers file"
