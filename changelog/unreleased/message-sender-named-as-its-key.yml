title: "A task's message is held only when its `metadata.from` names another sender than its key, by task name or by the whole principal `task:<project>:<task>`, which `mail.peers` may now name, and a `null` one names nobody; `talk pass --project` judges by the project given, no task may be named `people` or `person`, and a transport is given only a login of lowercase letters, digits and `-`, as `talk join` and `talk remove` give it a person; `talk pass` refuses a task given as no task name or a path, and a removed task of another project by the project its start recorded, which a removed task's conversation is read by too; a task of `default` believes its certifier only for a key certified for that task, and no task or `mail.peers` task may begin with `porelo-`"
type: fixed
