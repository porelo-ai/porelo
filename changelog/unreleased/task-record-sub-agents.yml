title: "A task's record names each tool call's `id`, the sub-agent call it ran under (`parent`) and its `run`, gives a sub-agent named exactly by an issue of the task's work, such as `ISSUE-1` or a tracker's reference, that issue on its own span too, and a sub-agent's own `tokens` where its agent's stream gives them through the new `usage` of Agent1 `ToolEvent`; it keeps at most 10 000 calls and counts the rest in `toolCallsDropped`, and a tool event with a negative or broken duration or token count is no event"
