title: "A task proposes an idea for itself, a new issue it found while working, with `ProposeIdea(task, title, whatMustBeTrue)` over its own MCP endpoint, where the project file's `limits.ideas` allows it, none by default; the daemon keeps each idea with the task as `idea-1`, `idea-2` and so on, and List and Watch carry them on the task's row as `ideas` until the task is removed"
type: added
