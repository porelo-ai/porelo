title: "A task start that fails leaves nothing running, kept or not, and an attended agent's files are written before its relay and gate, those in the workspace once it is checked out, and a host's forge token is taken only once the task's key is kept, so a failed start holds nothing `porelo task remove` cannot clear, and one that fails before its container leaves its conversation and its records too; a task brought back after a reboot keeps its number of subagents, the daemon's `Start` refuses a `subagents` that is no whole number before it asks a host or the runtime anything, and `CanStart` answers a project's own repository and a named repository without a gate as `Start` does"
type: fixed
